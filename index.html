<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayan Pharmacy Store</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- Chart.js (For Sales Chart) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(to right, #e0f7fa, #ffffff);
    transition: 0.4s;
}

.dark {
    background: #121212;
    color: white;
}

header {
    background: #0a9396;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #0a9396;
    color: white;
    margin: 5px 0;
}

button:hover {
    opacity: 0.8;
}

.container {
    padding: 20px;
}

.section {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
}

.dark .section {
    background: #1e1e1e;
}

#adminPanel {
    display: none;
}

/* Sales Chart */
.chart-container {
    max-width: 800px;
    margin: 30px auto;
}

/* Mobile-Responsive */
@media screen and (max-width: 768px) {
    header {
        font-size: 26px;
    }

    .section {
        margin: 10px 0;
    }

    .chart-container {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>Shayan Pharmacy Store</header>

<button class="toggle" onclick="toggleDark()">🌙 Dark Mode</button>

<div class="container">

<!-- CUSTOMER SAVE -->
<div class="section">
<h2>Customer Details</h2>
<input type="text" id="cname" placeholder="Customer Name">
<input type="text" id="cno" placeholder="Consumer Number">
<input type="text" id="caddress" placeholder="Address">
<button onclick="saveCustomer()">Save Customer</button>
</div>

<!-- BLOOD DATABASE -->
<div class="section">
<h2>Blood Donation Database</h2>
<input type="text" id="bname" placeholder="Donor Name">
<select id="bgroup">
    <option>A+</option>
    <option>A-</option>
    <option>B+</option>
    <option>B-</option>
    <option>O+</option>
    <option>O-</option>
    <option>AB+</option>
    <option>AB-</option>
</select>
<button onclick="saveBlood()">Add Donor</button>
</div>

<!-- INVOICE -->
<div class="section">
<h2>Generate Invoice</h2>
<input type="text" id="mname" placeholder="Medicine Name">
<input type="number" id="price" placeholder="Price">
<input type="number" id="qty" placeholder="Quantity">
<button onclick="generateInvoice()">Generate & Save</button>
<div id="invoiceResult"></div>
<button onclick="printInvoice()">🖨 Print Invoice</button>
</div>

<!-- ADMIN LOGIN -->
<div class="section">
<h2>Admin Login</h2>
<input type="password" id="adminPass" placeholder="Enter Admin Password">
<button onclick="adminLogin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="section" id="adminPanel">
<h2>Admin Panel</h2>

<h3>Customers</h3>
<table id="customerTable"></table>

<h3>Blood Donors</h3>
<table id="bloodTable"></table>

<h3>Invoices</h3>
<table id="invoiceTable"></table>

<h3>Sales Chart</h3>
<div class="chart-container">
    <canvas id="salesChart"></canvas>
</div>

</div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>

<script>
// Firebase Configuration (You need to replace this with your own Firebase credentials)
var firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

// Dark Mode Toggle
function toggleDark() {
    document.body.classList.toggle("dark");
}

// Save Customer Data
function saveCustomer() {
    let customers = JSON.parse(localStorage.getItem("customers")) || [];
    customers.push({
        name: cname.value,
        no: cno.value,
        address: caddress.value
    });
    localStorage.setItem("customers", JSON.stringify(customers));
    alert("Customer Saved!");
}

// Save Blood Donor Data
function saveBlood() {
    let donors = JSON.parse(localStorage.getItem("donors")) || [];
    donors.push({
        name: bname.value,
        group: bgroup.value
    });
    localStorage.setItem("donors", JSON.stringify(donors));
    alert("Donor Added!");
}

// Generate Invoice and Save
function generateInvoice() {
    let total = price.value * qty.value;
    let invoices = JSON.parse(localStorage.getItem("invoices")) || [];
    invoices.push({
        medicine: mname.value,
        price: price.value,
        qty: qty.value,
        total: total
    });
    localStorage.setItem("invoices", JSON.stringify(invoices));

    invoiceResult.innerHTML = `<h3>Total: Rs ${total}</h3>`;
}

// Print Invoice
function printInvoice() {
    window.print();
}

// Admin Login
function adminLogin() {
    if (adminPass.value === "1234") {
        document.getElementById("adminPanel").style.display = "block";
        loadData();
        loadSalesChart();
    } else {
        alert("Wrong Password!");
    }
}

// Load Data in Admin Panel
function loadData() {
    let customers = JSON.parse(localStorage.getItem("customers")) || [];
    let donors = JSON.parse(localStorage.getItem("donors")) || [];
    let invoices = JSON.parse(localStorage.getItem("invoices")) || [];

    customerTable.innerHTML = "<tr><th>Name</th><th>No</th><th>Address</th><th>Delete</th></tr>";
    customers.forEach((c, i) => {
        customerTable.innerHTML += `<tr>
            <td>${c.name}</td>
            <td>${c.no}</td>
            <td>${c.address}</td>
            <td><button onclick="deleteCustomer(${i})">Delete</button></td>
        </tr>`;
    });

    bloodTable.innerHTML = "<tr><th>Name</th><th>Group</th><th>Delete</th></tr>";
    donors.forEach((d, i) => {
        bloodTable.innerHTML += `<tr>
            <td>${d.name}</td>
            <td>${d.group}</td>
            <td><button onclick="deleteDonor(${i})">Delete</button></td>
        </tr>`;
    });

    invoiceTable.innerHTML = "<tr><th>Medicine</th><th>Price</th><th>Qty</th><th>Total</th><th>Delete</th></tr>";
    invoices.forEach((inv, i) => {
        invoiceTable.innerHTML += `<tr>
            <td>${inv.medicine}</td>
            <td>${inv.price}</td>
            <td>${inv.qty}</td>
            <td>${inv.total}</td>
            <td><button onclick="deleteInvoice(${i})">Delete</button></td>
        </tr>`;
    });
}

// Sales Chart using Chart.js
function loadSalesChart() {
    const invoices = JSON.parse(localStorage.getItem("invoices")) || [];
    const salesData = invoices.map(inv => inv.total);

    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array.from({ length: salesData.length }, (_, i) => `Invoice ${i+1}`),
            datasets: [{
                label: 'Sales (Rs)',
                data: salesData,
                borderColor: 'rgba(0, 123, 255, 1)',
                fill: false,
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Invoice Number'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Sales Amount'
                    }
                }
            }
        }
    });
}

// Delete Functions
function deleteCustomer(i) {
    let customers = JSON.parse(localStorage.getItem("customers"));
    customers.splice(i, 1);
    localStorage.setItem("customers", JSON.stringify(customers));
    loadData();
}

function deleteDonor(i) {
    let donors = JSON.parse(localStorage.getItem("donors"));
    donors.splice(i, 1);
    localStorage.setItem("donors", JSON.stringify(donors));
    loadData();
}

function deleteInvoice(i) {
    let invoices = JSON.parse(localStorage.getItem("invoices"));
    invoices.splice(i, 1);
    localStorage.setItem("invoices", JSON.stringify(invoices));
    loadData();
}

// Firebase Data Sync (Optional)
// Use Firebase Firestore to sync data. For example:
// db.collection("customers").add({
//     name: "John Doe",
//     address: "123 Main St"
// });

</script>

</body>
</html>
