<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shayan Pharmacy – Full Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Your existing styles */
</style>
</head>
<body>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
</script>

<!-- Sidebar + Main -->
<div class="sidebar" id="sidebar">
  <h2>Shayan Pharmacy Admin</h2>
  <a onclick="showPage('dashboard')">Dashboard</a>
  <!-- Your other sidebar links -->
</div>

<div class="main" id="mainContent">
  <!-- Dashboard content -->
  <div id="dashboard" class="page">
    <h1>Welcome to Shayan Pharmacy Dashboard</h1>
    <!-- Your existing dashboard content here -->
  </div>
  <!-- Add other pages if needed, using class="page" -->
</div>

<script>
// Show page function
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

// Show dashboard by default
showPage('dashboard');
</script>

</body>
</html>
