<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shayan Pharmacy</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background-image:url('https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=1470&q=80');
  background-size:cover;
  background-attachment:fixed;
  color:#333;
}
.sidebar{
  width:230px; height:100vh; position:fixed; top:0; left:0;
  background:rgba(0,0,0,0.6); padding-top:20px; backdrop-filter:blur(5px);
}
.sidebar h2{color:white; text-align:center; margin-bottom:30px;}
.sidebar a{
  display:block; color:white; padding:12px; text-decoration:none; font-weight:600; margin:5px; border-radius:6px;
  transition:0.2s;
}
.sidebar a:hover{background:rgba(255,255,255,0.2);}
.main{margin-left:230px; padding:20px;}
.card{
  background:rgba(255,255,255,0.85); padding:15px; border-radius:12px; margin:10px 0; box-shadow:0 6px 16px rgba(0,0,0,0.2);
}
button{
  padding:8px 15px; border:none; border-radius:6px; background:#0d6efd; color:white; cursor:pointer;
}
button:hover{background:#6c63ff;}
input{padding:8px; margin:5px 0; width:100%; border-radius:6px; border:1px solid #ccc;}
img.medImg{width:100%; height:150px; object-fit:cover; border-radius:10px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left;}
th{background:#0d6efd;color:white;border-radius:6px;}
</style>
</head>
<body>

<div class="sidebar">
<h2>Shayan Pharmacy</h2>
<a onclick="showPage('home')">Dashboard</a>
<a onclick="showPage('medicines')">Medicines</a>
<a onclick="showPage('orders')">Orders</a>
<a onclick="showPage('admin')">Admin Panel</a>
</div>

<div class="main">

<div id="home" class="page">
<h2>Dashboard</h2>
<div class="card">Total Medicines: <span id="totalMeds">0</span></div>
<div class="card">Cart Items: <span id="cartCount">0</span></div>
</div>

<div id="medicines" class="page" style="display:none;">
<h2>Medicines</h2>
<input type="text" id="search" placeholder="Search Medicine" onkeyup="searchMedicine()">
<div id="medicineList"></div>
<div class="card">
Cart Items: <span id="cartCount2">0</span> | Total: Rs <span id="cartTotal">0</span><br>
<button onclick="placeOrder()">Place Order</button>
</div>
</div>

<div id="orders" class="page" style="display:none;">
<h2>Orders</h2>
<ul id="orderList"></ul>
<a id="whatsappBtn" target="_blank">Send Order on WhatsApp</a>
</div>

<div id="admin" class="page" style="display:none;">
<h2>Admin Panel</h2>
<table>
<thead><tr><th>Name</th><th>Price</th><th>Image</th><th>Actions</th></tr></thead>
<tbody id="adminMedList"></tbody>
</table>
<h3>Add / Update Medicine</h3>
<input type="text" id="medName" placeholder="Name">
<input type="number" id="medPrice" placeholder="Price">
<input type="text" id="medImageURL" placeholder="Image URL">
<button onclick="addOrUpdateMedicine()">Add / Update</button>
</div>

</div>

<script>
// Pages
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById(id).style.display='block';}

// Dummy Medicines
var medicines=[
{name:"Paracetamol",price:50,image:"https://images.unsplash.com/photo-1604014232412-9d153f9fc2e1?auto=format&fit=crop&w=500&q=60"},
{name:"Ibuprofen",price:80,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Amoxicillin",price:120,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Vitamin C",price:60,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Cough Syrup",price:90,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Antacid",price:40,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Aspirin",price:70,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Metformin",price:200,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Loratadine",price:150,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Cetirizine",price:120,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Insulin",price:300,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Multivitamin",price:250,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Zinc Tablet",price:90,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Omega 3",price:300,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Diclofenac",price:110,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Azithromycin",price:250,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Omeprazole",price:180,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Levothyroxine",price:220,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Hydrochlorothiazide",price:100,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Prednisone",price:190,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Salbutamol",price:120,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Flu Vaccine",price:500,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Insulin Syringe",price:150,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Hydrocortisone",price:200,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Antihistamine",price:80,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Probiotics",price:300,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Calcium Tablet",price:120,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Magnesium",price:150,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Folic Acid",price:100,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"},
{name:"Iron Tablets",price:140,image:"https://images.unsplash.com/photo-1588776814546-1d93f1f0fc29?auto=format&fit=crop&w=500&q=60"}
];

// Load Medicines
function loadMedicines(){
  var list=document.getElementById("medicineList");
  var adminList=document.getElementById("adminMedList");
  list.innerHTML=""; adminList.innerHTML="";
  document.getElementById("totalMeds").innerText=medicines.length;
  medicines.forEach((m,i)=>{
    // Medicine Page
    let div=document.createElement("div"); div.className="card";
    div.innerHTML=`<img class="medImg" src="${m.image}"><b>${m.name}</b><br>Rs ${m.price}<br><button onclick="addToCart(${i})">Add to Cart</button>`;
    list.appendChild(div);
    // Admin Table
    let tr=document.createElement("tr");
    tr.innerHTML=`<td>${m.name}</td><td>${m.price}</td><td><img src="${m.image}" width="60"></td>
    <td><button onclick="deleteMedicine(${i})">Delete</button></td>`;
    adminList.appendChild(tr);
  });
}

// Search
function searchMedicine(){
  let val=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll('#medicineList .card').forEach((c,i)=>{
    c.style.display=medicines[i].name.toLowerCase().includes(val)?'block':'none';
  });
}

// Cart
var cart=[];
function addToCart(idx){cart.push(medicines[idx]); updateCart();}
function updateCart(){
  let total=0; cart.forEach(c=>total+=c.price);
  document.getElementById("cartCount").innerText=cart.length;
  document.getElementById("cartCount2").innerText=cart.length;
  document.getElementById("cartTotal").innerText=total;
}

// Orders
var orders=[];
function placeOrder(){ if(cart.length==0){alert("Cart empty"); return;}
orders.push([...cart]); cart=[]; updateCart(); alert("Order placed"); generateInvoice();}
function generateInvoice(){
  let text="Shayan Pharmacy Order\n";
  orders[orders.length-1].forEach(i=>text+=`${i.name} - Rs ${i.price}\n`);
  text+="Total: Rs "+orders[orders.length-1].reduce((a,b)=>a+b.price,0);
  document.getElementById("invoiceData").innerText=text;
  document.getElementById("whatsappBtn").href="https://wa.me/923XXXXXXXXX?text="+encodeURIComponent(text);
  // show orders
  let list=document.getElementById("orderList"); list.innerHTML="";
  orders.forEach((o,idx)=>{
    let li=document.createElement("li");
    li.innerText=`Order ${idx+1}: ${o.map(x=>x.name).join(", ")} | Rs ${o.reduce((a,b)=>a+b.price,0)}`;
    list.appendChild(li);
  });
}

// Admin Panel PIN
const adminPin="1234";
function adminAccess(){let pin=prompt("1234"); if(pin===adminPin) showPage('admin'); else alert("Wrong PIN");}

// Admin Add / Update
function addOrUpdateMedicine(){
  let name=document.getElementById("medName").value;
  let price=parseInt(document.getElementById("medPrice").value);
  let image=document.getElementById("medImageURL").value;
  if(!name||!price||!image){alert("Enter all fields"); return;}
  medicines.push({name,price,image});
  loadMedicines();
  alert("Medicine Added");
}

// Admin Delete
function deleteMedicine(idx){ if(confirm("Delete this medicine?")){medicines.splice(idx,1); loadMedicines();}}

// Init
loadMedicines();
</script>
</body>
</html>
