<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shayan Pharmacy – Full Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Slab:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Your existing styles */
</style>
</head>
<body>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
</script>

<!-- Login Page -->
<div id="loginPage">
<h2>Admin Login</h2>
<div class="card" style="max-width:400px;margin:auto;">
  <input type="email" id="login-email" placeholder="Email" required><br>
  <input type="password" id="login-password" placeholder="Password" required><br>
  <button onclick="login()">Login</button><br>
  <p>Don't have an account? <a href="#" onclick="showSignUp()">Sign Up</a></p>
</div>
</div>

<!-- Sign-Up Page -->
<div id="signUpPage" style="display:none;">
<h2>Admin Sign Up</h2>
<div class="card" style="max-width:400px;margin:auto;">
  <input type="email" id="signUp-email" placeholder="Email" required><br>
  <input type="password" id="signUp-password" placeholder="Password" required><br>
  <button onclick="signUp()">Sign Up</button>
  <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
</div>
</div>

<!-- Sidebar + Main -->
<div class="sidebar" id="sidebar" style="display:none;">
  <h2>Shayan Pharmacy Admin</h2>
  <a onclick="showPage('dashboard')">Dashboard</a>
  <!-- Your other sidebar links -->
</div>

<div class="main" id="mainContent" style="display:none;">
  <!-- Your main content here -->
</div>

<script>
// Show SignUp page
function showSignUp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('signUpPage').style.display = 'block';
}

// Show Login page
function showLogin() {
  document.getElementById('signUpPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
}

// Firebase Login Function
function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Logged in successfully
      const user = userCredential.user;
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('sidebar').style.display = 'block';
      document.getElementById('mainContent').style.display = 'block';
      showPage('dashboard');
      console.log('User logged in: ', user);
    })
    .catch((error) => {
      alert('Error: ' + error.message);
    });
}

// Firebase SignUp Function
function signUp() {
  const email = document.getElementById('signUp-email').value;
  const password = document.getElementById('signUp-password').value;

  auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Signed up successfully
      const user = userCredential.user;
      alert('Sign-up successful!');
      console.log('User signed up: ', user);
      showLogin(); // Redirect to login page
    })
    .catch((error) => {
      alert('Error: ' + error.message);
    });
}

// Page navigation function (as per your existing code)
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}
</script>

</body>
</html>
